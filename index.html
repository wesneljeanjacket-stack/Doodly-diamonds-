<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doodly Diamonds</title>
<style>
body{margin:0;background:#101525;color:white;font-family:Arial;text-align:center}
header{background:#07101f;padding:25px;color:#00e5ff}
h1{font-size:30px}
.box{background:#1b263b;margin:15px;padding:20px;border-radius:15px}
button{background:#00d9ff;color:#00101a;border:0;padding:13px;border-radius:9px;font-weight:bold}
input{padding:12px;margin:8px;border-radius:8px;border:0;width:85%}
</style>
</head>
<body>
<header>
<h1>💎 DOODLY DIAMONDS 💎</h1>
<p>Free Fire • Haiti 🇭🇹</p>
</header>
<div class="box">
<h2>Bienvenue !</h2>
<p>Choisissez votre pack de diamants.</p>
<p>100 💎 — 150 HTG</p>
<p>200 💎 — 300 HTG</p>
<p>300 💎 — 450 HTG</p>
<p>500 💎 — 850 HTG</p>
<p>1060 💎 — 1500 HTG</p>
</div>
<div class="box">
<h2>📱 Commander</h2>
<input id="player" placeholder="ID Free Fire">
<input id="pack" placeholder="Pack souhaité">
<button onclick="order()">Commander</button>
<p id="msg"></p>
</div>
<footer><p>Contactez-nous pour confirmer votre commande.</p></footer>
<script>
function order(){
let id=document.getElementById('player').value;
let pack=document.getElementById('pack').value;
if(!id||!pack){alert('Entrez votre ID et le pack souhaité');return}
document.getElementById('msg').innerText='Commande préparée ! Contactez le vendeur pour confirmer le paiement NatCash.';
}
</script>
</body>
</html>
